name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the HIP tests for gfx942 and runs the Catch2 ctest cases (`hipper-kernel` and
# `hipper-CUB`) on a simulated AMD Instinct MI300X
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ctest:
    name: ctest (ROCm 7.1 and simulated MI300X)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and ROCm
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: amd/mi300x
          cuda-toolkit: none
          rocm: "7.1"

      # The action installs only the compiler side; hipCUB (and rocPRIM, which
      # it depends on) is needed by tests/test_cub.cu.
      - name: Install hipCUB
        run: |
          sudo apt-get update
          sudo apt-get install -y hipcub-dev

      # The explicit CMAKE_HIP_ARCHITECTURES keeps CMake from probing for a GPU.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DHIPPER_TEST_PLATFORM=HIP \
            -DCMAKE_HIP_ARCHITECTURES=gfx942

      - name: Build
        run: cmake --build build -j3

      - name: Test
        run: vgpu run ctest --test-dir build --output-on-failure --no-tests=error
