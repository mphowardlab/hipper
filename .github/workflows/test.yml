name: test

on:
  pull_request:

  push:
    branches:
      - main

  workflow_call:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-cuda:
    name: CUDA ${{ matrix.cuda }}
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: "12.4.1"
            ubuntu: "22.04"
          - cuda: "12.5.1"
            ubuntu: "24.04"
          - cuda: "12.6.3"
            ubuntu: "24.04"
          - cuda: "12.8.1"
            ubuntu: "24.04"
          - cuda: "12.9.1"
            ubuntu: "24.04"
          - cuda: "13.0.2"
            ubuntu: "24.04"
          - cuda: "13.1.1"
            ubuntu: "24.04"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes cmake
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/install \
            -DHIPPER_TEST_PLATFORM=CUDA \
            -DCMAKE_CUDA_ARCHITECTURES=80
      - name: Build
        run: |
          cmake --build build
      - name: Install
        run: |
          cmake --install build

  build-hip:
    name: ROCm ${{ matrix.rocm }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rocm: "6.0.3"
            ubuntu: "22.04"
          - rocm: "6.1.4"
            ubuntu: "22.04"
          - rocm: "6.2.4"
            ubuntu: "24.04"
          - rocm: "6.3.4"
            ubuntu: "24.04"
          - rocm: "6.4.4"
            ubuntu: "24.04"
          - rocm: "7.0.3"
            ubuntu: "24.04"
          - rocm: "7.1.1"
            ubuntu: "24.04"
          - rocm: "7.2.0"
            ubuntu: "24.04"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Find ROCm repository
        id: set-rocm-repo
        run: |
          rocmfile=./.github/rocm/${{ matrix.rocm }}.txt
          if [[ -f $rocmfile ]]; then
            rocmdeb=$(cat $rocmfile)
            echo "rocmdeb=$rocmdeb" >> $GITHUB_OUTPUT
          else
            echo "Unknown ROCm version" && exit 1
          fi
      - name: Install ROCm
        run: |

          wget ${{ steps.set-rocm-repo.outputs.rocmdeb }} -O amdgpu-install.deb
          sudo apt-get install --yes ./amdgpu-install.deb
          sudo apt-get update
          sudo apt-get install --yes rocm-hip-sdk

          sudo tee --append /etc/ld.so.conf.d/rocm.conf <<EOF
          /opt/rocm/lib
          /opt/rocm/lib64
          EOF
          sudo ldconfig

          # inject rocm 7.1.1 onto path
          if [[ "${{ matrix.rocm }}" == "7.1.1" ]]; then
            echo "/opt/rocm-7.1.1/bin" >> $GITHUB_PATH
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get install --yes cmake
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/install \
            -DHIPPER_TEST_PLATFORM=HIP
      - name: Build
        run: |
          cmake --build build
      - name: Install
        run: |
          cmake --install build
