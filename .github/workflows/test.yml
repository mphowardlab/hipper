name: test

on:
  pull_request:

  push:
    branches:
      - main

  workflow_call:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-cuda:
    name: CUDA ${{ matrix.cuda }}
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu24.04
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.8.1"]
    steps:
      - name: Build and install
        uses: ./.github/actions/build-install
        with:
          platform: "nvidia"

  build-hip:
    name: ROCm 7.2
    runs-on: ubuntu-24.04
    steps:
      - name: Install ROCm
        run: |
          wget https://repo.radeon.com/amdgpu-install/7.2/ubuntu/noble/amdgpu-install_7.2.70200-1_all.deb
          sudo apt-get install --yes ./amdgpu-install_7.2.70200-1_all.deb
          sudo apt-get update
          sudo apt-get install --yes rocm-hip-sdk

          sudo tee --append /etc/ld.so.conf.d/rocm.conf <<EOF
          /opt/rocm/lib
          /opt/rocm/lib64
          EOF
          sudo ldconfig
      - name: Build and install
        uses: ./.github/actions/build-install
        with:
          platform: "amd"
